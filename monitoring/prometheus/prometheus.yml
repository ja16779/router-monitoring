global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenWrt Routers
  - job_name: 'openwrt_custom'
    static_configs:
      - targets: ['192.168.8.1:9101']
        labels:
          router: 'flint2'
          location: 'main'
    metrics_path: /metrics
    scrape_interval: 10s
